# preseed.cfg — Debian 13 netinst, instalación semi-desatendida para rigby
# (HP Stream 7, Bay Trail UEFI32 sobre CPU x86-64).
#
# Password de ops: la pide el instalador en pantalla (Steven la ingresa).
# WiFi: la pide el instalador en pantalla (Steven ingresa SSID + pass).
# sudo: con password, estándar.
# authorized_keys: la copia el late_command desde el valor público embebido abajo.

### Idioma y teclado
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect es_CO.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Red
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string rigby
d-i netcfg/get_domain string stevensierra.xyz

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Reloj
d-i clock-setup/utc boolean true
d-i time/zone string America/Bogota
d-i clock-setup/ntp boolean true

### Usuarios: root deshabilitado (sudo), ops creado por el instalador con prompt
d-i passwd/root-login boolean false
d-i passwd/user-fullname string ops
d-i passwd/username string ops
d-i passwd/user-default-groups string audio cdrom video plugdev sudo

### Particionado — un solo disco (eMMC), ext4, 1 GB swap, resto /
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/mmcblk0
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base + paquetes mínimos
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo openssh-server firmware-realtek firmware-linux-nonfree curl ca-certificates systemd-timesyncd htop less
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/mmcblk0

### Fin
d-i finish-install/reboot_in_progress note

### Post-install: solo autoriza la pubkey de rigby (es texto público, no hace sudo passwordless)
d-i preseed/late_command string \
    in-target sh -c 'install -d -o ops -g ops -m 0700 /home/ops/.ssh && \
      echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICuFWPLciYu5Soyz8i1Jb49A0Pg4aQv9s6YZYT5/od1w rigby-access" > /home/ops/.ssh/authorized_keys && \
      chown ops:ops /home/ops/.ssh/authorized_keys && chmod 0600 /home/ops/.ssh/authorized_keys && \
      echo "rigby preseed OK $(date -Is)" > /var/log/rigby-preseed.log'
